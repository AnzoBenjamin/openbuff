name: Evals

on:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  run-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Check commit message
        id: check_commit
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          shopt -s nocasematch
          if [[ "$COMMIT_MESSAGE" == *"[buffbench]"* ]]; then
            echo "should_run_evals=true" >> $GITHUB_OUTPUT
            echo "Commit message contains [buffbench] - will run evals"
          else
            echo "should_run_evals=false" >> $GITHUB_OUTPUT
            echo "Commit message does not contain [buffbench] - skipping evals"
          fi

      - name: Set up Bun
        if: ${{ steps.check_commit.outputs.should_run_evals == 'true' }}
        uses: oven-sh/setup-bun@v2 # TODO: pin to SHA
        with:
          bun-version: '1.3.5'

      - name: Cache dependencies
        if: ${{ steps.check_commit.outputs.should_run_evals == 'true' }}
        uses: actions/cache@v5 # TODO: pin to SHA
        with:
          path: |
            node_modules
            */node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-deps-${{ hashFiles('**/bun.lock*') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Install dependencies
        if: ${{ steps.check_commit.outputs.should_run_evals == 'true' }}
        run: bun install --frozen-lockfile

      - name: Set environment variables
        if: ${{ steps.check_commit.outputs.should_run_evals == 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CANOPYWAVE_API_KEY: ${{ secrets.CANOPYWAVE_API_KEY }}
          CODEBUFF_GITHUB_TOKEN: ${{ secrets.OPENBUFF_GITHUB_TOKEN }}
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          GRAVITY_API_KEY: ${{ secrets.GRAVITY_API_KEY }}
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
          LINKUP_API_KEY: ${{ secrets.LINKUP_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          NEXT_PUBLIC_CODEBUFF_APP_URL: ${{ secrets.NEXT_PUBLIC_CODEBUFF_APP_URL }}
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION_ID }}
          NEXT_PUBLIC_OPENBUFF_APP_URL: ${{ secrets.NEXT_PUBLIC_OPENBUFF_APP_URL }}
          NEXT_PUBLIC_POSTHOG_API_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_API_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST_URL: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST_URL }}
          NEXT_PUBLIC_SUPPORT_EMAIL: ${{ secrets.NEXT_PUBLIC_SUPPORT_EMAIL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: |
          VAR_NAMES=$(bun scripts/generate-ci-env.ts)
          # Export each required var from its named step env entry above.
          # generate-ci-env.ts prints a JSON array, so parse it before looping.
          for name in $(printf '%s' "$VAR_NAMES" | jq -r '.[]'); do
            value="${!name:-}"
            if [ -n "$value" ]; then
              echo "$name=$value" >> $GITHUB_ENV
            fi
          done
          echo "CODEBUFF_GITHUB_ACTIONS=true" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_CB_ENVIRONMENT=test" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_INFISICAL_UP=true" >> $GITHUB_ENV
          echo "CODEBUFF_GITHUB_TOKEN=$CODEBUFF_GITHUB_TOKEN" >> $GITHUB_ENV

      - name: Run evals
        if: ${{ steps.check_commit.outputs.should_run_evals == 'true' }}
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_SHA: ${{ github.sha }}
        run: cd evals && bun run-eval-set --concurrency 10 --email --title "Git Eval ($COMMIT_SHA $COMMIT_MESSAGE)"

      - name: Workflow completed
        run: echo "Evals workflow completed successfully"
