      #   - run: rustup target add ${{ matrix.target }}
      #   - run: cargo build --workspace --target ${{ matrix.target }} --release
      #   - run: cargo test --workspace --target ${{ matrix.target }}
      #   - run: ./scripts/smoke-test-sidecar.sh ${{ matrix.target }}
