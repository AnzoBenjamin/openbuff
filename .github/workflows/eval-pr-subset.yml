name: Eval PR Subset

# N10: run a small fixed buffbench subset (evals/buffbench/main-nightly.ts
# EVAL_SUBSETS.pr) on changes to agents, tool schemas or system prompts, and
# fail when it regresses past the noise band against the last green run on
# main. Pushes to main refresh that baseline.

on:
  pull_request:
    paths:
      - 'agents/**'
      - 'common/src/tools/params/**'
      - 'packages/agent-runtime/src/system-prompt/**'
      - 'packages/agent-runtime/src/templates/**'
      - 'packages/agent-runtime/src/tools/prompts.ts'
      - 'evals/buffbench/**'
      - '.github/workflows/eval-pr-subset.yml'
  push:
    branches: [main]
    paths:
      - 'agents/**'
      - 'common/src/tools/params/**'
      - 'packages/agent-runtime/src/system-prompt/**'
      - 'packages/agent-runtime/src/templates/**'
      - 'packages/agent-runtime/src/tools/prompts.ts'
      - 'evals/buffbench/**'
      - '.github/workflows/eval-pr-subset.yml'
  workflow_dispatch:

permissions:
  contents: read
  # Read the last green main run's results artifact for the baseline.
  actions: read

concurrency:
  group: eval-pr-subset-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  eval-subset:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'

      - name: Cache dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            node_modules
            */node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-deps-${{ hashFiles('**/bun.lock*') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Key-free: a prompt or agent change that breaks agent loading, the eval
      # file or the subset task ids fails here, even on fork PRs.
      - name: Validate subset configuration (no LLM calls)
        run: cd evals && bun run-buffbench-pr-subset --dry-run

      - name: Set environment variables
        id: env
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CODEBUFF_GITHUB_TOKEN: ${{ secrets.OPENBUFF_GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: |
          VAR_NAMES=$(bun scripts/generate-ci-env.ts)
          for name in $(printf '%s' "$VAR_NAMES" | jq -r '.[]'); do
            value="${!name:-}"
            if [ -n "$value" ]; then
              echo "$name=$value" >> $GITHUB_ENV
            fi
          done
          echo "CODEBUFF_GITHUB_ACTIONS=true" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_CB_ENVIRONMENT=test" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_INFISICAL_UP=true" >> $GITHUB_ENV
          echo "CODEBUFF_GITHUB_TOKEN=$CODEBUFF_GITHUB_TOKEN" >> $GITHUB_ENV
          # Fork PRs get no secrets: skip the live subset instead of failing.
          if [ -n "$ANTHROPIC_API_KEY$OPENAI_API_KEY$OPEN_ROUTER_API_KEY$DEEPSEEK_API_KEY$FIREWORKS_API_KEY$MOONSHOT_API_KEY$OPENCODE_API_KEY$SILICONFLOW_API_KEY" ]; then
            echo "has_keys=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keys=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No provider keys available; skipping the live eval subset."
          fi

      - name: Run eval subset (base2)
        id: run
        if: steps.env.outputs.has_keys == 'true'
        run: |
          cd evals && bun run-buffbench-pr-subset \
            --results-out "$RUNNER_TEMP/eval-results/FINAL_RESULTS.json"

      - name: Download last green main results
        if: steps.run.outcome == 'success' && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow eval-pr-subset.yml --branch main --event push \
            --status success --limit 1 --json databaseId -q '.[0].databaseId // empty')
          mkdir -p "$RUNNER_TEMP/eval-baseline"
          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
              -n buffbench-pr-subset-results -D "$RUNNER_TEMP/eval-baseline" \
              || echo "Baseline artifact for run $RUN_ID is unavailable."
          else
            echo "No green main run yet; comparison skipped."
          fi

      - name: Compare with last green run
        if: steps.run.outcome == 'success'
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/eval-baseline"
          cd evals && bun eval-gate \
            --current "$RUNNER_TEMP/eval-results/FINAL_RESULTS.json" \
            --baseline "$RUNNER_TEMP/eval-baseline" \
            --report "$RUNNER_TEMP/eval-results/GATE_REPORT.md"
          STATUS=$?
          cat "$RUNNER_TEMP/eval-results/GATE_REPORT.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
          exit $STATUS

      - name: Upload results artifact
        if: always() && steps.run.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: buffbench-pr-subset-results
          path: ${{ runner.temp }}/eval-results/
          if-no-files-found: warn
          retention-days: 90
