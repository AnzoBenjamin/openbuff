[install]
# Keep SDK installs consistent with root hoisted setup
linker = "hoisted"
linkWorkspacePackages = true

[test]
# Exclude large test repositories from execution
exclude = ["../evals/test-repos/**"]
# setup-scm-loader preload removed: tree-sitter queries load via fs at
# query-load time (packages/code-map/src/languages.ts resolveQueryPath), so the
# .scm text-loader plugin is no longer required for tests that transitively
# import code-map. Reintroduce it ONLY if a .scm module import ever returns.
preload = ["./test/setup-env.ts"]
