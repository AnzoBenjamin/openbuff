[install]
# Keep SDK installs consistent with root hoisted setup
linker = "hoisted"
linkWorkspacePackages = true

[test]
# Exclude large test repositories from execution
exclude = ["../evals/test-repos/**"]
preload = ["./test/setup-env.ts", "../test/setup-scm-loader.ts"]
# test/setup-scm-loader.ts registers the .scm text loader required by
# @codebuff/code-map tree-sitter queries. Running `bun test` from this package
# directory uses THIS bunfig (not the repo-root one), so without the scm-loader
# preload any test transitively importing code-map fails at import with a
# parse error on the .scm file. Mirrors packages/agent-runtime/bunfig.toml.
